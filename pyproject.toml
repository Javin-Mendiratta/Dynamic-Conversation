[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dynamic-conversation"
version = "0.1.0"
description = "Emotion flow analysis and strategy simulation for dialogues"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "datasets>=2.14.0",
  "huggingface-hub>=0.16.4",
  "pandas>=1.5.3",
  "numpy>=1.24.3",
  "transformers>=4.30.0",
  "torch>=2.0.0",
  "tokenizers>=0.13.0",
  "requests>=2.31.0",
  "tqdm>=4.65.0",
  "PyYAML>=6.0",
  "packaging>=23.0",
  "filelock>=3.12.0",
  "matplotlib>=3.7.0",
  "seaborn>=0.12.0",
  "plotly>=5.14.0",
  "jsonlines>=3.1.0",
]

[tool.setuptools.packages.find]
include = ["dynamic_conversation"]
exclude = ["results", "notebooks"]
