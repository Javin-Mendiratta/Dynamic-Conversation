name: dynamic-conversation-2
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pandas>=1.5
  - numpy>=1.24
  - matplotlib>=3.7
  - seaborn>=0.12
  - ipykernel
  - jupyter
  - pytorch=2.1.*  # pin to avoid torch.load incompatibility
  - torchvision
  - torchaudio
  - cudatoolkit=11.8
  - pip
  - pip:
      - datasets>=2.14.0
      - huggingface-hub>=0.16.4
      - transformers>=4.30.0
      - tokenizers>=0.13.0
      - tqdm>=4.65.0
      - plotly>=5.14.0
      - jsonlines>=3.1.0
      - openai>=1.30.0
      - -e .
